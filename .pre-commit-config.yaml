repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: \.(vue|js|jsx|ts|tsx)$
        pass_filenames: false
