<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>订阅管理</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="images/icon_64.png" alt="订阅管理" />
      <span class="brand-name">订阅管理</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="subscriptions" title="订阅列表">
        <span class="nav-icon" aria-hidden="true">📋</span>
        <span class="nav-label">订阅列表</span>
      </button>
      <button class="nav-item" data-view="calendar" title="日历">
        <span class="nav-icon" aria-hidden="true">📅</span>
        <span class="nav-label">日历</span>
      </button>
      <button class="nav-item" data-view="statistics" title="统计">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">统计</span>
      </button>
      <button class="nav-item" data-view="settings" title="设置">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label">设置</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-primary btn-block btn-new-sub" id="btn-new" title="新增订阅">
        <span class="btn-icon">+</span>
        <span class="btn-label">新增订阅</span>
      </button>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收起导航" title="收起导航" aria-expanded="true">
        <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span class="toggle-label">收起导航</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h1 id="view-title">订阅列表</h1>
      <div class="topbar-actions">
        <button class="btn" id="btn-backup">💾 立即备份</button>
      </div>
    </header>

    <div id="notice-banner" class="notice hidden"></div>

    <!-- 订阅列表视图 -->
    <section id="view-subscriptions" class="view active">
      <div class="stats-grid" id="stats-cards"></div>
      <div class="filter-bar">
        <input type="search" id="filter-search" placeholder="搜索订阅名称..." />
        <select id="filter-category"><option value="">全部分类</option></select>
        <select id="filter-status">
          <option value="">全部状态</option>
          <option value="active">活跃</option>
          <option value="expiring">即将到期</option>
          <option value="in_payment">待支付</option>
          <option value="grace_period">宽限期</option>
          <option value="canceled">已取消</option>
          <option value="expired">已过期</option>
        </select>
      </div>
      <div class="card">
        <div class="table-scroll">
          <table class="table" id="sub-table">
            <thead>
              <tr>
                <th>订阅</th><th>金额</th><th>周期</th><th>下次扣费</th>
                <th>剩余</th><th>状态</th><th class="ta-r">操作</th>
              </tr>
            </thead>
            <tbody id="sub-tbody"></tbody>
          </table>
        </div>
        <div id="sub-empty" class="empty hidden">还没有订阅，点击右上角「新增订阅」开始记录</div>
      </div>
    </section>

    <!-- 日历视图 -->
    <section id="view-calendar" class="view">
      <div class="cal-head">
        <button class="btn" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="btn" id="cal-next">›</button>
        <button class="btn btn-ghost" id="cal-today">今天</button>
      </div>
      <div class="card">
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>

    <!-- 统计视图 -->
    <section id="view-statistics" class="view">
      <div class="stats-grid" id="stats-big"></div>
      <div class="grid-2">
        <div class="card">
          <h3>近 12 个月趋势 <span id="trend-unit" class="muted"></span></h3>
          <div class="trend-chart" id="trend-chart"></div>
        </div>
        <div class="card">
          <h3>分类统计</h3>
          <div class="table-scroll">
            <table class="table">
              <thead><tr><th>分类</th><th>月支出</th><th>年支出</th><th>占比</th></tr></thead>
              <tbody id="cat-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- 设置视图 -->
    <section id="view-settings" class="view">
      <div class="grid-2">
        <div class="card">
          <h3>常规</h3>
          <label class="field">
            <span>默认货币</span>
            <select id="set-default-currency">
              <option value="CNY">CNY (¥)</option>
              <option value="USD">USD ($)</option>
              <option value="HKD">HKD (HK$)</option>
            </select>
          </label>
          <label class="field">
            <span>USD → CNY 汇率</span>
            <input type="number" id="set-rate-usd" step="0.0001" min="0" />
          </label>
          <label class="field">
            <span>HKD → CNY 汇率</span>
            <input type="number" id="set-rate-hkd" step="0.0001" min="0" />
          </label>
          <label class="field">
            <span>到期提醒提前天数</span>
            <input type="number" id="set-notify-days" min="0" max="90" />
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="set-notify-enabled" />
            <span>启用到期提醒</span>
          </label>
          <div class="field dnd">
            <span>免打扰时段</span>
            <div class="dnd-inputs">
              <input type="time" id="set-dnd-start" />
              <span>—</span>
              <input type="time" id="set-dnd-end" />
            </div>
          </div>
        </div>

        <div class="card">
          <h3>通知渠道</h3>
          <label class="field checkbox">
            <input type="checkbox" id="set-email-enabled" />
            <span>邮件通知 (SMTP)</span>
          </label>
          <label class="field"><span>SMTP 服务器</span><input type="text" id="set-smtp-host" placeholder="smtp.example.com" /></label>
          <label class="field"><span>SMTP 端口</span><input type="number" id="set-smtp-port" placeholder="465" /></label>
          <label class="field"><span>用户名</span><input type="text" id="set-smtp-user" /></label>
          <label class="field"><span>密码 / 授权码</span><input type="password" id="set-smtp-pass" /></label>
          <label class="field"><span>发件人地址</span><input type="text" id="set-smtp-from" placeholder="user@example.com" /></label>
          <hr class="sep" />
          <label class="field checkbox">
            <input type="checkbox" id="set-pushplus-enabled" />
            <span>PushPlus 微信推送</span>
          </label>
          <label class="field"><span>PushPlus Token</span><input type="text" id="set-pushplus-token" /></label>
        </div>
      </div>

      <div class="card">
        <h3>分类管理</h3>
        <div class="cat-editor">
          <input type="text" id="cat-name" placeholder="新分类名称" />
          <input type="text" id="cat-icon" placeholder="图标 emoji，如 📺" class="cat-icon" />
          <button class="btn btn-primary" id="btn-add-cat">添加</button>
        </div>
        <div class="cat-list" id="cat-list"></div>
      </div>

      <div class="card">
        <h3>备份与数据</h3>
        <p class="muted">数据保存在本机 SQLite。每日自动导出 JSON + 数据库副本到共享目录 <code>subscription/backups</code>，保留最近 14 份。</p>
        <div class="backup-actions">
          <button class="btn" id="btn-backup-now">立即备份</button>
          <button class="btn" id="btn-export-json">导出 JSON</button>
          <button class="btn" id="btn-export-csv">导出 CSV</button>
          <label class="btn file-btn">导入 JSON<input type="file" id="file-import-json" accept=".json" hidden /></label>
          <label class="btn file-btn">导入 CSV<input type="file" id="file-import-csv" accept=".csv" hidden /></label>
        </div>
        <div class="table-scroll">
          <table class="table" id="backup-table">
            <thead><tr><th>备份文件</th><th>大小</th></tr></thead>
            <tbody id="backup-tbody"></tbody>
          </table>
        </div>
        <div class="muted" id="save-hint"></div>
      </div>
    </section>
  </main>
</div>

<!-- 订阅编辑弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modal-title">新增订阅</h2>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <form id="sub-form">
      <input type="hidden" id="f-id" />
      <div class="form-grid">
        <label class="field span-2"><span>名称 *</span><input type="text" id="f-name" required placeholder="如 Netflix" /></label>
        <label class="field"><span>分类</span><select id="f-category"></select></label>
        <label class="field"><span>货币</span><select id="f-currency">
          <option value="CNY">CNY (¥)</option><option value="USD">USD ($)</option><option value="HKD">HKD (HK$)</option>
        </select></label>
        <label class="field"><span>金额（元）*</span><input type="number" id="f-amount" required min="0" step="0.01" placeholder="68" /></label>
        <label class="field"><span>周期</span><select id="f-period">
          <option value="month">月付</option><option value="quarter">季付</option>
          <option value="year">年付</option><option value="once">一次性</option>
          <option value="custom">自定义</option>
        </select></label>
        <label class="field" id="f-custom-wrap" hidden><span>自定义周期</span>
          <span class="inline"><input type="number" id="f-custom-value" min="1" value="1" />
          <select id="f-custom-unit"><option value="day">天</option><option value="week">周</option><option value="month">月</option><option value="year">年</option></select></span>
        </label>
        <label class="field checkbox span-2"><input type="checkbox" id="f-auto-renew" checked /><span>自动续费</span></label>
        <label class="field"><span>开始日期</span><input type="date" id="f-start" /></label>
        <label class="field"><span>首次付款日</span><input type="date" id="f-first-pay" /></label>
        <label class="field span-2"><span>下次扣费日</span><input type="date" id="f-next-due" /></label>
        <label class="field span-2"><span>备注</span><textarea id="f-notes" rows="2" placeholder="可选"></textarea></label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
